<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinymachines</title>
<meta name="description" content="tinymachines — a studio making tiny machines for iPhone. Small apps, smaller games. Soon on your screen.">
<meta name="theme-color" content="#FFFFFF">

<!-- Open Graph / social preview -->
<meta property="og:type" content="website">

<meta property="og:description" content="a studio making tiny machines for iPhone — small apps, smaller games. soon on your screen.">
<meta name="twitter:card" content="summary">

<!-- Favicon: a tiny terracotta pixel square -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FFFFFF'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23E0785C'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #111111;
    --paper: #FFFFFF;
    --screen: #FAFAFA;
    --muted: #8A8A8A;
    --faint: #C9C9C9;
    --accent: #E0785C;
    --shadow-offset: 14px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'VT323', 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 28px 20px 72px;
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  /* ---------- terminal window ---------- */
  .tm-win {
    position: relative;
    width: min(800px, 92vw);
  }

  .tm-shadow {
    position: absolute;
    left: var(--shadow-offset);
    top: var(--shadow-offset);
    width: 100%;
    height: 100%;
    z-index: 0;
    image-rendering: pixelated;
  }

  .tm-screen {
    position: relative;
    z-index: 1;
    border: 2px solid var(--ink);
    background: var(--screen);
    overflow: hidden;
  }

  .tm-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--ink);
    padding: 10px 12px;
    background: var(--paper);
  }

  .tm-dots {
    display: flex;
    gap: 6px;
  }

  .tm-btn {
    width: 10px;
    height: 10px;
    display: block;
    cursor: pointer;
  }
  .tm-btn.close   { background: var(--accent); }
  .tm-btn.min     { background: var(--muted); }
  .tm-btn.restore { background: var(--faint); }

  .tm-title {
    margin-left: 8px;
    font-family: 'Silkscreen', 'VT323', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: none;
  }

  .tm-body {
    padding: clamp(22px, 4vw, 34px) clamp(20px, 4vw, 38px) clamp(26px, 4.5vw, 40px);
    font-family: 'VT323', 'Courier New', monospace;
    font-size: clamp(21px, 3.2vw, 26px);
    line-height: 1.42;
    color: var(--ink);
  }

  .tm-v { color: var(--muted); margin-bottom: clamp(20px, 2.6vw, 26px); }

  .tm-cmd .sigil { color: var(--accent); }

  .tm-answer {
    padding-left: clamp(18px, 2.4vw, 26px);
    margin: 0 0 clamp(20px, 2.6vw, 26px);
  }
  .tm-answer.last { margin-bottom: 0; }

  .tm-dim { color: var(--muted); }

  .tm-cursor { color: var(--accent); }

  /* typewriter: span reveals by animating its clip width */
  [data-tm-type].typing {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    vertical-align: bottom;
    width: 0ch;
  }

  /* reopen dot (after clicking close) */
  .tm-reopen {
    display: none;
    width: 14px;
    height: 14px;
    background: var(--ink);
    cursor: pointer;
  }
  .tm-win.is-closed { display: none; }

  /* ---------- footer wordmark ---------- */
  .tm-foot {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 22px;
    text-align: center;
    font-family: 'Silkscreen', 'VT323', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--faint);
    pointer-events: none;
  }

  @keyframes tmblink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  .blinking { animation: tmblink 1.1s steps(1, end) infinite; }

  @media (max-width: 480px) {
    :root { --shadow-offset: 10px; }
    .tm-btn { width: 8px; height: 8px; }
    .tm-dots { gap: 5px; }
    .tm-foot { bottom: 18px; font-size: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blinking { animation: none; }
  }
</style>
</head>
<body>

  <main class="tm-win" data-tm-win aria-label="tinymachines terminal">
    <div class="tm-shadow" aria-hidden="true"></div>
    <div class="tm-screen">
      <div class="tm-bar">
        <div class="tm-dots">
          <span class="tm-btn close"   data-tm-btn="close"   title="close"></span>
          <span class="tm-btn min"     data-tm-btn="min"     title="minimize"></span>
          <span class="tm-btn restore" data-tm-btn="restore" title="restore"></span>
        </div>
        <span class="tm-title">tinymachines — terminal</span>
      </div>

      <div class="tm-body" data-tm-body>
        <div class="tm-v" data-tm-line><span data-tm-type>tinymachines v0.1</span></div>

        <div class="tm-cmd" data-tm-line><span class="sigil">$</span> <span data-tm-type data-tm-slow>whoami</span></div>
        <div class="tm-answer">
          <div data-tm-line><span data-tm-type>a studio making tiny machines for iPhone&nbsp;—</span></div>
          <div data-tm-line><span data-tm-type>small apps, smaller games.</span></div>
          <div class="tm-dim" data-tm-line><span data-tm-type>we do this, and only this.</span></div>
        </div>

        <div class="tm-cmd" data-tm-line><span class="sigil">$</span> <span data-tm-type data-tm-slow>status</span></div>
        <div class="tm-answer">
          <div data-tm-line><span data-tm-type>building the first ones. slowly, with care.</span></div>
        </div>

        <div class="tm-cmd" data-tm-line><span class="sigil">$</span> <span data-tm-type data-tm-slow>next</span></div>
        <div class="tm-answer last">
          <div data-tm-line><span data-tm-type>soon on your screen</span><span class="tm-cursor" data-tm-cursor>_</span></div>
        </div>
      </div>
    </div>

    <span class="tm-reopen" data-tm-reopen title="reopen"></span>
  </main>

  <div class="tm-foot">TINYMACHINES · 2026</div>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var win    = document.querySelector('[data-tm-win]');
  var body   = document.querySelector('[data-tm-body]');
  var shadow = document.querySelector('.tm-shadow');
  var cursor = document.querySelector('[data-tm-cursor]');
  var reopen = document.querySelector('[data-tm-reopen]');
  var timers = [];
  var stopped = false;

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  /* ---------- pixel dither shadow ---------- */
  function buildShadow() {
    if (!shadow) return;
    var px = 4;
    var w = shadow.offsetWidth, h = shadow.offsetHeight;
    if (!w || !h) return;
    var palette = [];
    var k;
    for (k = 0; k < 76; k++) palette.push('#111111');
    for (k = 0; k < 10; k++) palette.push('#FFFFFF');
    ['#3A3A3A','#3A3A3A','#3A3A3A','#8A8A8A','#8A8A8A','#8A8A8A','#8A8A8A','#B4763F','#B4763F','#B4763F']
      .forEach(function (c) { palette.push(c); });

    var cols = Math.ceil(w / px), rows = Math.ceil(h / px);
    var c = document.createElement('canvas');
    c.width = cols; c.height = rows;
    var ctx = c.getContext('2d');
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var t = (x / cols) * 0.5 + (y / rows) * 0.5;
        if (Math.random() < 0.82 + Math.pow(1 - t, 0.8) * 0.55) {
          ctx.fillStyle = palette[(Math.random() * palette.length) | 0];
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
    shadow.style.backgroundImage = 'url(' + c.toDataURL() + ')';
    shadow.style.backgroundSize = (cols * px) + 'px ' + (rows * px) + 'px';
  }

  /* ---------- typewriter ---------- */
  function reveal(job) {
    job.span.classList.remove('typing');
    job.span.style.width = 'auto';
    job.span.style.overflow = 'visible';
    job.span.style.whiteSpace = 'normal';
    job.span.style.display = 'inline';
  }

  function typeBody() {
    var lines = Array.prototype.slice.call(body.querySelectorAll('[data-tm-line]'));
    if (cursor) { cursor.style.opacity = '0'; cursor.classList.remove('blinking'); }

    var jobs = [];
    lines.forEach(function (line) {
      var span = line.querySelector('[data-tm-type]');
      if (!span) return;
      span.classList.add('typing');
      line.style.visibility = 'hidden';
      jobs.push({ line: line, span: span, len: span.textContent.length, slow: span.hasAttribute('data-tm-slow') });
    });

    if (reduce) {
      jobs.forEach(function (j) { j.line.style.visibility = 'visible'; reveal(j); });
      if (cursor) { cursor.style.opacity = '1'; }
      return;
    }

    var i = 0;
    function nextLine() {
      if (stopped) return;
      if (i >= jobs.length) {
        if (cursor) { cursor.style.opacity = '1'; cursor.classList.add('blinking'); }
        return;
      }
      var job = jobs[i++];
      job.line.style.visibility = 'visible';
      var n = 0;
      var step = job.slow ? 58 : 15;
      (function tick() {
        if (stopped) return;
        n++;
        job.span.style.width = n + 'ch';
        if (n < job.len) timers.push(setTimeout(tick, step));
        else { reveal(job); timers.push(setTimeout(nextLine, job.slow ? 400 : 110)); }
      })();
    }
    timers.push(setTimeout(nextLine, 450));
  }

  /* ---------- window controls ---------- */
  function openWin(retype) {
    win.classList.remove('is-closed');
    if (reopen) reopen.style.display = 'none';
    body.style.display = 'block';
    stopped = false;
    clearTimers();
    requestAnimationFrame(buildShadow);
    if (retype) typeBody();
  }
  function closeWin() {
    win.classList.add('is-closed');
    if (reopen) reopen.style.display = 'inline-block';
  }
  function toggleMin() {
    body.style.display = (body.style.display === 'none') ? 'block' : 'none';
    requestAnimationFrame(buildShadow);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('[data-tm-btn]');
    var dot = e.target.closest && e.target.closest('[data-tm-reopen]');
    if (dot) { openWin(true); return; }
    if (!btn) return;
    var kind = btn.getAttribute('data-tm-btn');
    if (kind === 'close') closeWin();
    else if (kind === 'min') toggleMin();
    else openWin(false);
  });

  /* ---------- boot ---------- */
  function boot() { buildShadow(); typeBody(); }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { requestAnimationFrame(boot); });
    // fallback in case fonts.ready never resolves
    setTimeout(function () { if (!shadow.style.backgroundImage) boot(); }, 1200);
  } else {
    window.addEventListener('load', boot);
  }

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(buildShadow, 150);
  });
})();
</script>
</body>
</html>
